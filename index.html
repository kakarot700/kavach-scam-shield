<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAVACH — scam messages, explained before you tap</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --line:#1f2937; --ink:#e8eef6; --muted:#8b9bb0;
    --safe:#22c55e; --maybe:#f59e0b; --scam:#ef4444; --accent:#38bdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
  header{padding:22px 20px 10px;max-width:820px;margin:0 auto}
  h1{margin:0;font-size:26px;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .tag{color:var(--muted);margin:6px 0 0;font-size:14px}
  main{max-width:820px;margin:0 auto;padding:0 20px 60px}
  .langs{display:flex;gap:8px;margin:16px 0}
  .langs button{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
  .langs button.on{color:var(--ink);border-color:var(--accent)}
  textarea{width:100%;min-height:120px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .actions{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
  .actions button{font:inherit;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  #check{background:var(--accent);color:#04121c;border-color:var(--accent);font-weight:600}
  #demo{border-color:var(--line)}
  .samples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .samples button{background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  #caption{color:var(--accent);font-size:13px;margin:0 0 6px}
  #result{margin-top:22px}
  .verdict{display:flex;align-items:center;gap:10px;font-size:20px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
  .verdict .dot{width:12px;height:12px;border-radius:50%}
  .verdict.scam .dot{background:var(--scam)} .verdict.maybe .dot{background:var(--maybe)} .verdict.safe .dot{background:var(--safe)}
  .verdict.scam{border-color:#7f1d1d} .verdict.maybe{border-color:#78350f} .verdict.safe{border-color:#14532d}
  .verdict .score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
  .bar{height:8px;background:var(--panel);border-radius:999px;margin:10px 0 6px;overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;border-radius:999px}
  .fill.scam{background:var(--scam)} .fill.maybe{background:var(--maybe)} .fill.safe{background:var(--safe)}
  .muted{color:var(--muted)} .small{font-size:12px}
  .msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;white-space:pre-wrap;word-break:break-word}
  .flag{background:rgba(239,68,68,.22);border-bottom:2px solid var(--scam);border-radius:3px;padding:0 2px}
  h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
  ul.signals{list-style:none;padding:0;margin:0}
  ul.signals li{padding:8px 0;border-bottom:1px solid var(--line)}
  ul.signals b{font-weight:600}
  .quote{color:var(--muted);font-size:14px}
  .upi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .upi .row{display:flex;gap:12px;padding:4px 0}
  .upi .k{color:var(--muted);min-width:90px;font-size:14px}
  .upi .v{font-variant-numeric:tabular-nums;word-break:break-all}
  .warn{color:#fca5a5;margin:10px 0 0;font-size:14px}
  ol.todo{padding-left:20px;margin:0}
  ol.todo li{padding:5px 0}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>KAVACH <span>कवच</span></h1>
  <p class="tag">Scam messages, explained before you tap. On-device, offline, in Hindi, English and Hinglish.</p>
</header>
<main>
  <div class="langs">
    <button data-lang="en">English</button>
    <button data-lang="hi">हिंदी</button>
    <button data-lang="hi_lat">Hinglish</button>
  </div>
  <p id="caption" hidden></p>
  <textarea id="msg" placeholder="Paste an SMS, WhatsApp message or UPI link here…"></textarea>
  <div class="actions">
    <button id="check">Check message</button>
    <button id="demo">Play demo</button>
  </div>
  <div class="samples">
    <button data-sample="0">SBI KYC</button>
    <button data-sample="1">CBI arrest</button>
    <button data-sample="2">UPI collect</button>
    <button data-sample="3">Real OTP</button>
  </div>
  <section id="result" hidden></section>
</main>
<footer><p id="offline">Runs fully offline. Nothing you paste leaves this device.</p></footer>
<script src="feat.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
