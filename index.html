<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAVACH — scam messages, explained before you tap</title>
<style>
  :root{
    --ink:#1e1b4b; --ink2:#475569; --muted:#64748b; --line:rgba(99,102,241,.14);
    --card:rgba(255,255,255,.78); --solid:#ffffff;
    --safe:#059669; --maybe:#d97706; --scam:#e11d48; --accent:#6366f1; --accent2:#a855f7;
    --shadow:0 1px 2px rgba(30,27,75,.04),0 10px 30px -12px rgba(79,70,229,.22);
  }
  *{box-sizing:border-box}
  html{background:#f7f7fc}
  body{margin:0;min-height:100vh;color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(900px 520px at -10% -10%, #e0e7ff 0%, rgba(224,231,255,0) 60%),
      radial-gradient(760px 520px at 110% 0%, #fce7f3 0%, rgba(252,231,243,0) 58%),
      radial-gradient(820px 620px at 50% 110%, #dcfce7 0%, rgba(220,252,231,0) 60%),
      radial-gradient(600px 420px at 100% 70%, #e0f2fe 0%, rgba(224,242,254,0) 60%),
      linear-gradient(180deg,#fbfaff 0%,#f6f8ff 100%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased}
  header{max-width:860px;margin:0 auto;padding:30px 20px 6px;display:flex;align-items:center;gap:14px}
  .logo{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
    background:linear-gradient(135deg,#818cf8 0%,#c084fc 55%,#f472b6 100%);box-shadow:0 10px 24px -10px rgba(139,92,246,.7)}
  .logo svg{width:28px;height:28px}
  h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-weight:800;
    background:linear-gradient(90deg,#4338ca,#7c3aed 55%,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 span{font-weight:700;margin-left:4px}
  .tag{color:var(--ink2);margin:4px 0 0;font-size:14.5px}
  .badges{max-width:860px;margin:10px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .badge{font-size:12.5px;color:#4338ca;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
  main{max-width:860px;margin:0 auto;padding:18px 20px 40px}
  .panel{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:18px;box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .langs{display:inline-flex;gap:4px;margin:0 0 14px;padding:4px;background:#eef0fb;border-radius:999px}
  .langs button{background:transparent;color:var(--muted);border:0;border-radius:999px;padding:7px 16px;font:inherit;font-size:14px;cursor:pointer;transition:all .2s}
  .langs button.on{color:#3730a3;background:#fff;box-shadow:0 2px 8px -2px rgba(79,70,229,.35);font-weight:600}
  textarea{width:100%;min-height:128px;background:#fff;color:var(--ink);border:1.5px solid #e5e7f5;border-radius:16px;padding:14px 16px;font:inherit;resize:vertical;transition:border-color .2s,box-shadow .2s}
  textarea::placeholder{color:#94a3b8}
  textarea:focus{outline:none;border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(165,180,252,.28)}
  .actions{display:flex;gap:10px;margin:14px 0 12px;flex-wrap:wrap}
  .actions button{font:inherit;font-weight:600;border-radius:14px;padding:12px 22px;cursor:pointer;transition:transform .15s,box-shadow .2s}
  .actions button:active{transform:translateY(1px)}
  #check{flex:1 1 180px;color:#fff;border:0;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 60%,#a855f7 100%);box-shadow:0 10px 22px -10px rgba(99,102,241,.8)}
  #check:hover{box-shadow:0 14px 28px -10px rgba(99,102,241,.9)}
  #demo{flex:0 1 auto;color:#4338ca;background:#fff;border:1.5px solid #c7d2fe}
  #demo:disabled{opacity:.6;cursor:default}
  .samples{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .samples::before{content:"Try";font-size:12.5px;color:var(--muted);margin-right:2px}
  .samples button{font:inherit;font-size:13px;border-radius:999px;padding:6px 13px;cursor:pointer;border:1px solid transparent;transition:transform .15s}
  .samples button:hover{transform:translateY(-1px)}
  .samples button[data-sample="0"]{background:#ffe4e6;color:#9f1239}
  .samples button[data-sample="1"]{background:#fef3c7;color:#92400e}
  .samples button[data-sample="2"]{background:#e0f2fe;color:#075985}
  .samples button[data-sample="3"]{background:#dcfce7;color:#166534}
  #caption{display:inline-block;color:#6d28d9;background:#f3e8ff;border-radius:999px;font-size:12.5px;font-weight:600;padding:3px 11px;margin:0 0 8px 8px}
  #caption[hidden]{display:none}
  #result{margin-top:18px;background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:18px;box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:rise .35s ease}
  #result[hidden]{display:none}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .verdict{display:flex;align-items:center;gap:12px;font-size:21px;padding:16px 18px;border-radius:18px;border:1px solid transparent}
  .verdict strong{font-weight:750;letter-spacing:-.01em}
  .verdict .dot{flex:none;width:14px;height:14px;border-radius:50%}
  .verdict.scam{background:linear-gradient(135deg,#fff1f2 0%,#ffe4e6 60%,#fce7f3 100%);border-color:#fecdd3;color:#9f1239}
  .verdict.maybe{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 60%,#ffedd5 100%);border-color:#fde68a;color:#92400e}
  .verdict.safe{background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 60%,#d1fae5 100%);border-color:#bbf7d0;color:#065f46}
  .verdict.scam .dot{background:var(--scam);box-shadow:0 0 0 5px rgba(225,29,72,.15)}
  .verdict.maybe .dot{background:var(--maybe);box-shadow:0 0 0 5px rgba(217,119,6,.15)}
  .verdict.safe .dot{background:var(--safe);box-shadow:0 0 0 5px rgba(5,150,105,.15)}
  .verdict .score{margin-left:auto;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 12px}
  .bar{height:10px;background:#eef0f7;border-radius:999px;margin:14px 2px 6px;overflow:hidden}
  .fill{height:100%;border-radius:999px;transition:width .5s ease}
  .fill.scam{background:linear-gradient(90deg,#fda4af,#e11d48)}
  .fill.maybe{background:linear-gradient(90deg,#fde68a,#f59e0b)}
  .fill.safe{background:linear-gradient(90deg,#a7f3d0,#10b981)}
  .muted{color:var(--muted)} .small{font-size:12.5px;margin:4px 2px}
  .rule,.cap{background:#f5f3ff;border-radius:10px;padding:7px 11px;color:#5b21b6!important}
  .msg{background:#fff;border:1px solid #eceefa;border-radius:16px;padding:14px 16px;margin:16px 0;white-space:pre-wrap;word-break:break-word;font-size:15.5px;color:#334155}
  .flag{background:linear-gradient(180deg,rgba(254,205,211,0) 35%,#fecdd3 35%);color:#881337;font-weight:600;border-radius:4px;padding:0 3px}
  h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:#6d28d9;margin:22px 2px 10px;font-weight:700}
  ul.signals{list-style:none;padding:0;margin:0;display:grid;gap:8px}
  ul.signals li{background:#fff;border:1px solid #eceefa;border-left:4px solid #f472b6;border-radius:12px;padding:10px 13px}
  ul.signals b{font-weight:650;color:var(--ink)}
  .quote{color:var(--muted);font-size:14px}
  .upi{background:linear-gradient(135deg,#eff6ff 0%,#e0f2fe 55%,#ecfeff 100%);border:1px solid #bae6fd;border-radius:16px;padding:14px 16px;margin:10px 0}
  .upi .row{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed rgba(14,116,144,.18)}
  .upi .row:last-of-type{border-bottom:0}
  .upi .k{color:#0369a1;min-width:92px;font-size:13.5px;font-weight:600}
  .upi .v{font-variant-numeric:tabular-nums;word-break:break-all;color:#0c4a6e}
  .warn{color:#9f1239;background:#fff1f2;border:1px solid #fecdd3;border-radius:10px;padding:8px 11px;margin:10px 0 0;font-size:14px;font-weight:600}
  ol.todo{list-style:none;counter-reset:t;padding:0;margin:0;display:grid;gap:8px}
  ol.todo li{counter-increment:t;position:relative;background:linear-gradient(135deg,#f0fdf4,#ecfeff);border:1px solid #d1fae5;border-radius:12px;padding:10px 13px 10px 46px;color:#134e4a}
  ol.todo li::before{content:counter(t);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#34d399,#06b6d4)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:linear-gradient(135deg,#eef2ff,#fae8ff);border:1px solid #e0e7ff;border-radius:999px;padding:5px 12px;font-size:13px;color:#4c1d95;font-weight:600;font-variant-numeric:tabular-nums}
  footer{max-width:860px;margin:0 auto;padding:0 20px 40px;text-align:center}
  footer p{display:inline-flex;align-items:center;gap:8px;margin:0;color:#047857;font-size:13px;background:rgba(236,253,245,.85);border:1px solid #a7f3d0;border-radius:999px;padding:7px 14px}
  footer p::before{content:"";width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.18)}
  @media (min-width:720px){
    header{padding-top:44px} h1{font-size:36px} .panel,#result{padding:24px}
    .verdict{font-size:23px}
  }
  @media (max-width:420px){
    .langs{display:flex} .langs button{flex:1;padding:7px 6px}
    #demo{flex:1 1 100%}
  }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></div>
  <div>
    <h1>KAVACH <span>कवच</span></h1>
    <p class="tag">Scam messages, explained before you tap. On-device, offline, in Hindi, English and Hinglish.</p>
  </div>
</header>
<div class="badges"><span class="badge">100% offline</span><span class="badge">English · हिंदी · Hinglish</span><span class="badge">UPI link decoder</span></div>
<main>
 <div class="panel">
  <div class="langs">
    <button data-lang="en">English</button>
    <button data-lang="hi">हिंदी</button>
    <button data-lang="hi_lat">Hinglish</button>
  </div>
  <p id="caption" hidden></p>
  <textarea id="msg" placeholder="Paste an SMS, WhatsApp message or UPI link here…"></textarea>
  <div class="actions">
    <button id="check">Check message</button>
    <button id="demo">Play demo</button>
  </div>
  <div class="samples">
    <button data-sample="0">SBI KYC</button>
    <button data-sample="1">CBI arrest</button>
    <button data-sample="2">UPI collect</button>
    <button data-sample="3">Real OTP</button>
  </div>
 </div>
  <section id="result" hidden></section>
</main>
<footer><p id="offline">Runs fully offline. Nothing you paste leaves this device.</p></footer>
<script src="feat.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
